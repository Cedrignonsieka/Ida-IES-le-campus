<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournoi PRO</title>
<style>
    body{background:#0a0a0a;color:#fff;font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:0}
    header{background:#111;padding:15px;text-align:center;border-bottom:2px solid #ff0000;position:sticky;top:0;z-index:10}
    nav button{background:#222;color:#fff;border:1px solid #444;padding:10px 20px;margin:5px;border-radius:8px;cursor:pointer;font-weight:bold;transition:0.2s}
    nav button.active{background:#ff0000;border-color:#ff0000}
    .container{padding:20px;max-width:1200px;margin:auto}
    .hidden{display:none}

    /* ACTUALITES */
    .grid-actu{display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:15px}
    .card-actu{background:#1a1a1a;border-radius:12px;overflow:hidden;border:1px solid #333;box-shadow:0 4px 10px #000}
    .card-actu img{width:100%;height:200px;object-fit:cover;background:#222}
    .card-actu p{padding:15px;margin:0;font-size:15px;line-height:1.4}

    /* EN DIRECT */
    .match-card{background:#1a1a1a;border-radius:12px;padding:15px;margin-bottom:15px;border-left:4px solid #ff0000}
    .score{display:flex;justify-content:space-between;align-items:center;font-size:24px;font-weight:bold}
    .buts{display:flex;justify-content:space-between;font-size:13px;color:#aaa;margin-top:10px}
    .buts div{width:45%}
    .buts div:last-child{text-align:right}
    .info-match{font-size:12px;color:#777;margin-top:8px;text-align:center}
</style>
</head>
<body>
<header>
    <h1>TOURNOI PRO 2026</h1>
    <nav>
        <button onclick="showTab('accueil')" class="active">ACCUEIL</button>
        <button onclick="showTab('direct')">EN DIRECT</button>
    </nav>
</header>

<div class="container">
    <div id="accueil">Chargement...</div>
    <div id="direct" class="hidden">Chargement...</div>
</div>

<script>
// TES LIENS CSV
const URL_ACTU = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=383038295&single=true&output=csv";
const URL_BUTS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=54148263&single=true&output=csv";

function showTab(tab){
    document.querySelectorAll('.container > div').forEach(d=>d.classList.add('hidden'));
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.getElementById(tab).classList.remove('hidden');
    document.querySelector(`button[onclick="showTab('${tab}')"]`).classList.add('active');
}

// Convertir CSV en JSON
function csvToJson(csv){
    const lines = csv.trim().split('\n');
    const headers = lines[0].split(',');
    return lines.slice(1).map(line => {
        const values = line.split(',');
        let obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i]?.trim());
        return obj;
    });
}

async function loadData(){
    const [resActu, resButs] = await Promise.all([fetch(URL_ACTU), fetch(URL_BUTS)]);
    const actuData = csvToJson(await resActu.text());
    const butsData = csvToJson(await resButs.text());

    // 1. CHARGER ACTUALITES
    let htmlActu = '<div class="grid-actu">';
    if(actuData.length > 0){
        const row = actuData[0]; // Ligne 1
        for(let i=1; i<=10; i++){
            const texte = row[`Texte ${i}`];
            if(texte && texte !== ""){
                htmlActu += `
                <div class="card-actu">
                    <img src="${i}.jpg" onerror="this.src='https://placehold.co/400x200/222/fff?text=Photo+${i}'">
                    <p>${texte}</p>
                </div>`;
            }
        }
    }
    htmlActu += '</div>';
    document.getElementById('accueil').innerHTML = htmlActu;

    // 2. CHARGER EN DIRECT
    let htmlDirect = '';
    // On regroupe les buts par équipe pour faire le score
    const score = {};
    butsData.forEach(b=>{
        if(!score[b.Equipe]) score[b.Equipe] = [];
        score[b.Equipe].push(b);
    });

    // Exemple : on affiche tous les matchs possibles. Tu peux ajouter une feuille EN DIRECT si tu veux
    const equipes = [...new Set(butsData.map(b=>b.Equipe))];
    for(let i=0; i<equipes.length; i+=2){
        const e1 = equipes[i];
        const e2 = equipes[i+1];
        if(!e1 || !e2) continue;

        const butsE1 = score[e1] || [];
        const butsE2 = score[e2] || [];

        let listeButs1 = butsE1.map(b=>`⚽ ${b.Joueur} ${b.Minute}'`).join('<br>');
        let listeButs2 = butsE2.map(b=>`⚽ ${b.Joueur} ${b.Minute}'`).join('<br>');

        htmlDirect += `
        <div class="match-card">
            <div class="score">
                <span>${e1}</span>
                <span>${butsE1.length} - ${butsE2.length}</span>
                <span>${e2}</span>
            </div>
            <div class="buts">
                <div>${listeButs1}</div>
                <div>${listeButs2}</div>
            </div>
        </div>`;
    }
    document.getElementById('direct').innerHTML = htmlDirect || "Aucun match";
}

loadData();
setInterval(loadData, 20000); // Actualise toutes les 20s
</script>
</body>
</html>
