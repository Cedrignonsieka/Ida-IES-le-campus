<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOURNOI LIVE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');
  :root{ --vert: #00FF88; --noir: #0A0A0A; --glass: rgba(20,20,20,0.7); --blanc: #FFFFFF; --jaune: #FFD700; --gris: #888; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background: var(--noir); color: var(--blanc); font-family: 'Poppins', sans-serif; min-height: 100vh; padding-bottom: 70px; }

  header{ text-align: center; padding: 20px 10px; }
  header h1{ font-size: 24px; font-weight: 700; color: var(--vert); letter-spacing: 1px; }

 .tabs{ display: flex; gap: 8px; padding: 0 12px 12px 12px; overflow-x: auto; }
 .tab{ background: var(--glass); color: var(--vert); padding: 10px 16px; border-radius: 12px; flex:1; text-align:center; cursor:pointer; border: 1px solid rgba(0,255,136,0.2); font-weight: 600; font-size: 14px; transition: 0.2s; }
 .tab.active{ background: var(--vert); color: var(--noir); }

 .card{ background: var(--glass); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 16px; margin: 0 12px 12px 12px; }
 .card-live{ border: 1px solid var(--vert); }

 .top-info{ display:flex; justify-content:space-between; font-size: 11px; color: var(--gris); margin-bottom: 8px; }
 .score-main{ display:flex; justify-content:space-between; align-items:center; font-size: 22px; font-weight: 700; }
 .team-name{ flex:1; }
 .score-num{ color: var(--jaune); padding: 0 12px; font-size: 28px; }
 .chrono{ background: #FF2D2D; color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; text-align: center; margin-top: 8px; width: fit-content; }
 .goals{ font-size: 12px; color: #BBB; margin-top: 8px; }
 .goals span{ margin-right: 8px; }

 .poule{ font-weight: 700; color: var(--vert); margin: 16px 12px 8px 12px; font-size: 16px; }
  table{ width: 100%; background: var(--glass); border-radius: 12px; overflow: hidden; font-size: 14px; }
  th{ background: rgba(0,255,136,0.08); color: var(--vert); padding: 12px 8px; font-weight: 600; }
  td{ padding: 12px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }

  footer{ background: var(--glass); border-top: 1px solid rgba(0,255,136,0.1); padding: 15px 10px; text-align: center; position: fixed; bottom: 0; width: 100%; }
  footer p{ color: var(--gris); font-size: 10px; }
</style>
</head>
<body>

<header><h1>TOURNOI PREMIUM 2025</h1></header>

<div class="tabs">
  <div class="tab active" onclick="show('live', this)">LIVE</div>
  <div class="tab" onclick="show('next', this)">PROGRAMME</div>
  <div class="tab" onclick="show('fini', this)">RÉSULTATS</div>
  <div class="tab" onclick="show('class', this)">CLASSEMENT</div>
  <div class="tab" onclick="show('buteurs', this)">BUTEURS</div>
</div>

<div id="live">Chargement...</div>
<div id="next" style="display:none"></div>
<div id="fini" style="display:none"></div>
<div id="class" style="display:none"></div>
<div id="buteurs" style="display:none"></div>

<footer><p>© 2025 TOURNOI PREMIUM | Actualisation auto</p></footer>

<script>
const SHEET_LIVE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=0&single=true&output=csv";
const SHEET_NEXT = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1457749805&single=true&output=csv";
const SHEET_FINI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1202405658&single=true&output=csv";

let L=[],N=[],F=[];
let isFirstLoad = true;

function show(id, el){
  document.querySelectorAll('#live,#next,#fini,#class,#buteurs').forEach(d=>d.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function csv(csv){
  let l=csv.split('\n'),
  h=l[0].split(',').map(x=>x.trim());
  return l.slice(1).map(x=>{
    let v=x.split(',');
    let o={};
    h.forEach((k,i)=>o[k]=v[i]?v[i].trim():'');
    return o;
  }).filter(x=>x['Equipe 1']);
}

function buts(t){
  let b={};
  if(!t) return b;
  t.split(',').forEach(x=>{
    let parts = x.trim().split(' ');
    let n = parts[0];
    if(n) b[n]=(b[n]||0)+1
  });
  return b;
}

function getChrono(heureDebut){
  if(!heureDebut) return "0'";
  const [h,m,s=0] = heureDebut.split(':').map(Number);
  const debut = new Date(); debut.setHours(h,m,s,0);
  const now = new Date();
  let diff = Math.floor((now - debut) / 1000 / 60);
  if(diff < 0) diff = 0;
  if(diff > 90) return "FT";
  return diff + "'";
}

function classement(){
  let t={};
  [...F,...L].forEach(m=>{ if(m['Score 1']==='') return;
    let e1=m['Equipe 1'], e2=m['Equipe 2'], s1=+m['Score 1'], s2=+m['Score 2'], p=m['Poule'];
    if(!t[e1]) t[e1]={e:e1,p:p,pts:0}; if(!t[e2]) t[e2]={e:e2,p:p,pts:0};
    if(s1>s2) t[e1].pts+=3; else if(s2>s1) t[e2].pts+=3; else {t[e1].pts++; t[e2].pts++;}
  });
  return t;
}

function buildAll(){
  // LIVE
  let hl=''; L.filter(m=>m['Score 1']!=='').forEach(m=>{
    let minute = getChrono(m['HeureDebut']);
    hl+=`<div class="card card-live">
      <div class="top-info"><span>Poule ${m['Poule']}</span><span>● LIVE</span></div>
      <div class="score-main"><div class="team-name">${m['Equipe 1']}</div><div class="score-num">${m['Score 1']} - ${m['Score 2']}</div><div class="team-name" style="text-align:right">${m['Equipe 2']}</div></div>
      <div class="chrono" data-heure="${m['HeureDebut']}">${minute}</div>
      <div class="goals">⚽ ${m['Buteurs']}</div>
    </div>`;
  });
  document.getElementById('live').innerHTML=hl||'<div class="card">Aucun match en cours</div>';

  // PROGRAMME
  let hn=''; N.forEach(m=> hn+=`<div class="card"><div class="top-info">${m['Date']} - ${m['Heure']}</div><b>${m['Equipe 1']}</b> <span style="color:var(--vert)">VS</span> <b>${m['Equipe 2']}</b><div style="font-size:12px; color:var(--gris)">Poule ${m['Poule']}</div></div>`);
  document.getElementById('next').innerHTML=hn||'<div class="card">Aucun match programmé</div>';

  // RESULTATS
  let hf=''; [...F].reverse().forEach(m=> hf+=`<div class="card"><div class="top-info">${m['Date']} ${m['Heure']} | Poule ${m['Poule']}</div><div class="score-main"><div class="team-name">${m['Equipe 1']}</div><div class="score-num">${m['Score 1']} - ${m['Score 2']}</div><div class="team-name" style="text-align:right">${m['Equipe 2']}</div></div><div class="goals">⚽ ${m['Buteurs']}</div></div>`);
  document.getElementById('fini').innerHTML=hf||'<div class="card">Aucun résultat</div>';

  // CLASSEMENT
  let tc=classement(), poules={};
  Object.values(tc).forEach(x=>{ if(!poules[x.p]) poules[x.p]=[]; poules[x.p].push(x); });
  let hc='';
  for(let p in poules){
    poules[p].sort((a,b)=>b.pts-a.pts);
    hc+=`<div class="poule">GROUPE ${p}</div><table><tr><th>#</th><th>CLUB</th><th>PTS</th></tr>`;
    poules[p].forEach((x,i)=> hc+=`<tr><td>${i+1}</td><td>${x.e}</td><td><b>${x.pts}</b></td></tr>`);
    hc+='</table>';
  }
  document.getElementById('class').innerHTML=hc||'<div class="card">Pas encore de classement</div>';

  // BUTEURS
  let tb={}; [...F,...L].forEach(m=>{ let b=buts(m['Buteurs']); for(let n in b) tb[n]=(tb[n]||0)+b[n]; });
  let top=Object.entries(tb).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let hbu='';
  top.forEach((x,i)=> hbu+=`<div class="card"><b>${i+1}. ${x[0]}</b> <span style="float:right; color:var(--jaune); font-weight:700">${x[1]} BUTS</span></div>`);
  document.getElementById('buteurs').innerHTML=hbu||'<div class="card">Aucun but marqué</div>';
}

function updateChronoOnly(){
  document.querySelectorAll('.chrono').forEach(el=>{
    let heure = el.getAttribute('data-heure');
    el.innerText = getChrono(heure);
  });
}

function loadData(){
  Promise.all([fetch(SHEET_LIVE).then(r=>r.text()),fetch(SHEET_NEXT).then(r=>r.text()),fetch(SHEET_FINI).then(r=>r.text())])
 .then(([l,n,f])=>{
    L=csv(l); N=csv(n); F=csv(f);
    if(isFirstLoad){
      buildAll();
      isFirstLoad = false;
    }
  });
}

// 1. Chargement initial
loadData();

// 2. Le chrono tourne toutes les secondes
setInterval(updateChronoOnly, 1000);

// 3. Les données se rechargent toutes les 30 secondes sans bouger l'écran
setInterval(loadData, 30000);
</script>
</body>
</html>
