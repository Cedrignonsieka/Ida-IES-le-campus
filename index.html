<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi Foot - Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>⚽ TOURNOI LIVE</h1>
    </header>

    <main>
        <section id="live">
            <h2>EN DIRECT</h2>
            <div id="live-match">Chargement...</div>
        </section>

        <section id="avenir">
            <h2>À VENIR</h2>
            <div id="matchs-a-venir">Chargement...</div>
        </section>

        <section id="termines">
            <h2>TERMINÉS</h2>
            <div id="matchs-termines">Chargement...</div>
        </section>

        <section id="classement">
            <h2>CLASSEMENT</h2>
            <table>
                <thead>
                    <tr>
                        <th>Poule</th><th>Équipe</th><th>V</th><th>D</th><th>Pts</th>
                    </tr>
                </thead>
                <tbody id="classement-body">
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
