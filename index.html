<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournoi - Live Score</title>
<style>
    :root{
        --bleu: #2563eb;
        --bleu-clair: #eff6ff;
        --gris: #f1f5f9;
        --texte: #1e293b;
        --rouge: #dc2626;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial, sans-serif}
    body{background:var(--gris);color:var(--texte)}

    /* HEADER */
    header{background:#fff;padding:15px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);position:sticky;top:0;z-index:10}
   .logo{font-size:1.5em;font-weight:800;color:var(--bleu)}
   .logo span{color:var(--rouge)}

    /* NAV */
   .btns{display:flex;gap:10px;padding:15px 20px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto}
   .btn{background:var(--gris);border:none;color:var(--texte);padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
   .btn.active{background:var(--bleu);color:#fff}

   .container{max-width:900px;margin:0 auto;padding:20px}

    /* CARDS */
   .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
   .score{display:flex;justify-content:space-between;align-items:center;font-size:2.2em;font-weight:800;text-align:center}
   .team{display:flex;flex-direction:column;align-items:center;gap:5px;width:35%}
   .team-logo{width:50px;height:50px;background:var(--bleu-clair);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bleu)}
   .minute{background:var(--rouge);color:#fff;padding:8px 15px;border-radius:20px;font-size:0.8em;font-weight:700}
   .vs{font-size:0.5em;color:#94a3b8}

    /* TABLE */
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.9em}
    th{background:var(--bleu-clair);color:var(--bleu);padding:12px;text-align:left;font-weight:700}
    td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0}
    tr:hover{background:#f8fafc}

   .buteur{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid #e2e8f0}
   .buteur span:first-child{font-weight:600}
   .buteur span:last-child{background:var(--bleu-clair);color:var(--bleu);padding:4px 10px;border-radius:20px;font-weight:700}

   .poule-titre{font-size:1.2em;font-weight:800;color:var(--bleu);margin-bottom:10px}

    /* FOOTER */
    footer{background:#fff;text-align:center;padding:20px;margin-top:30px;color:#64748b;font-size:0.9em;border-top:1px solid #e2e8f0}
   .loading{text-align:center;padding:40px;color:#94a3b8}
</style>
</head>
<body>

<header>
    <div class="logo">TOURNOI<span>.LIVE</span></div>
</header>

<nav class="btns">
    <button class="btn active" onclick="showTab('live',this)">🔴 LIVE</button>
    <button class="btn" onclick="showTab('classement',this)">📊 CLASSEMENT</button>
    <button class="btn" onclick="showTab('programme',this)">📅 PROGRAMME</button>
    <button class="btn" onclick="showTab('buteurs',this)">⚽ BUTEURS</button>
</nav>

<div class="container">
    <div id="live" class="tab"></div>
    <div id="classement" class="tab" style="display:none"></div>
    <div id="programme" class="tab" style="display:none"></div>
    <div id="buteurs" class="tab" style="display:none"></div>
</div>

<footer>
    © 2026 Tournoi.live - Tous droits réservés | Mise à jour auto toutes les 15s
</footer>

<script>
const URLS = {
    matchs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=0&single=true&output=csv",
    buteursLive: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=705498821&single=true&output=csv",
    equipes: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=543674070&single=true&output=csv",
    programme: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1749873809&single=true&output=csv",
    resultats: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1338870764&single=true&output=csv",
    buteurs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1383311710&single=true&output=csv"
}

async function fetchCSV(url){
    const res = await fetch(url + '&t=' + Date.now());
    const txt = await res.text();
    return txt.split('\n').map(r => r.replace(/\r/g,'').split(',').map(c => c.trim()));
}

function calcMinute(heureDebut){
    if(!heureDebut) return "00:00";
    heureDebut = heureDebut.replace('.',':');
    const [h,m] = heureDebut.split(':').map(Number);
    if(isNaN(h)) return "00:00";
    const debut = new Date(); debut.setHours(h,m,0);
    const now = new Date();
    let diff = Math.floor((now - debut)/60000);
    if(diff < 0) diff = 0;
    if(diff > 90) diff = 90;
    return diff + "'";
}

function showTab(id,btn){
    document.querySelectorAll('.tab').forEach(t => t.style.display='none');
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display='block';
    btn.classList.add('active');
}

// 1. LIVE
async function loadLive(){
    const [matchs, buts] = await Promise.all([fetchCSV(URLS.matchs), fetchCSV(URLS.buteursLive)]);
    const match = matchs[1];
    if(!match ||!match[0]) return document.getElementById('live').innerHTML="<div class='loading'>Aucun match en cours</div>";

    const [domi, ext, statut, heure] = match;
    const scoreDomi = buts.filter(b => b[1]?.toLowerCase() === domi.toLowerCase()).length;
    const scoreExt = buts.filter(b => b[1]?.toLowerCase() === ext.toLowerCase()).length;
    const minute = statut.toLowerCase().includes("cours")? calcMinute(heure) : statut;

    document.getElementById('live').innerHTML = `
    <div class="card">
        <div class="score">
            <div class="team">
                <div class="team-logo">${domi.substring(0,2)}</div>
                <div>${domi}</div>
                <div>${scoreDomi}</div>
            </div>
            <div>
                <div class="minute">${minute}</div>
                <div class="vs">VS</div>
            </div>
            <div class="team">
                <div class="team-logo">${ext.substring(0,2)}</div>
                <div>${ext}</div>
                <div>${scoreExt}</div>
            </div>
        </div>
    </div>
    <div class="card"><h3>Buteurs du match</h3>
        ${buts.filter(b => b[1]?.toLowerCase() === domi.toLowerCase() || b[1]?.toLowerCase() === ext.toLowerCase()).map(b => `<div class="buteur"><span>${b[0]}</span><span>${b[1]} ${b[2]}'</span></div>`).join('') || '<div class="loading">Aucun but pour le moment</div>'}
    </div>`;
}

// 2. CLASSEMENT
async function loadClassement(){
    const [equipes, resultats] = await Promise.all([fetchCSV(URLS.equipes), fetchCSV(URLS.resultats)]);
    let html = '';
    const poules = [...new Set(equipes.slice(1).map(e => e[1]).filter(Boolean))];

    poules.forEach(poule => {
        const eqs = equipes.slice(1).filter(e => e[1] === poule).map(e => e[0]);
        let tab = {};
        eqs.forEach(eq => tab[eq] = {J:0,G:0,N:0,P:0,BP:0,BC:0,PTS:0});

        resultats.slice(1).filter(r => r[5] === poule).forEach(r => {
            const [e1,e2,s1,s2] = [r[0],r[1],+r[2]||0,+r[3]||0];
            if(tab[e1]){tab[e1].J++; tab[e1].BP+=s1; tab[e1].BC+=s2;}
            if(tab[e2]){tab[e2].J++; tab[e2].BP+=s2; tab[e2].BC+=s1;}
            if(s1>s2){if(tab[e1]){tab[e1].G++;tab[e1].PTS+=3;} if(tab[e2]){tab[e2].P++;}}
            if(s1<s2){if(tab[e2]){tab[e2].G++;tab[e2].PTS+=3;} if(tab[e1]){tab[e1].P++;}}
            if(s1===s2){if(tab[e1]){tab[e1].N++;tab[e1].PTS+=1;} if(tab[e2]){tab[e2].N++;tab[e2].PTS+=1;}}
        });

        const classement = Object.entries(tab).sort((a,b)=>b[1].PTS-a[1].PTS || (b[1].BP-b[1].BC)-(a[1].BP-a[1].BC));
        html += `<div class="card"><div class="poule-titre">POULE ${poule}</div><table><tr><th>#</th><th>Club</th><th>J</th><th>G</th><th>N</th><th>P</th><th>BP</th><th>BC</th><th>Diff</th><th>PTS</th></tr>`;
        classement.forEach(([eq,s],i)=> html += `<tr><td>${i+1}</td><td><b>${eq}</b></td><td>${s.J}</td><td>${s.G}</td><td>${s.N}</td><td>${s.P}</td><td>${s.BP}</td><td>${s.BC}</td><td>${s.BP-s.BC}</td><td><b>${s.PTS}</b></td></tr>`);
        html += '</table></div>';
    });
    document.getElementById('classement').innerHTML = html || "<div class='loading'>Aucune donnée</div>";
}

// 3. PROGRAMME
async function loadProgramme(){
    const data = await fetchCSV(URLS.programme);
    let html = '<div class="card"><h3>PROGRAMME DES MATCHS</h3><table><tr><th>Date</th><th>Heure</th><th>Match</th><th>Poule</th></tr>';
    data.slice(1).filter(r=>r[0]).forEach(r => html += `<tr><td>${r[2]}</td><td>${r[3]}</td><td><b>${r[0]}</b> vs <b>${r[1]}</b></td><td>${r[4]}</td></tr>`);
    html += '</table></div>';
    document.getElementById('programme').innerHTML = html;
}

// 4. BUTEURS AUTO
async function loadButeurs(){
    const data = await fetchCSV(URLS.buteurs);
    const count = {};
    data.slice(1).forEach(r => { if(r[0]) count[r[0]] = (count[r[0]]||0)+1; });
    const top = Object.entries(count).sort((a,b)=>b[1]-a[1]);
    let html = '<div class="card"><h3>CLASSEMENT BUTEURS</h3>';
    html += top.length? top.map(([nom,buts],i) => `<div class="buteur"><span>${i+1}. ${nom}</span><span>${buts} buts</span></div>`).join('') : '<div class="loading">Aucun buteur</div>';
    html += '</div>';
    document.getElementById('buteurs').innerHTML = html;
}

loadLive(); loadClassement(); loadProgramme(); loadButeurs();
setInterval(()=>{loadLive(); loadClassement(); loadProgramme(); loadButeurs();},15000);
</script>

</body>
</html>
