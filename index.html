<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournoi - Live Score</title>
<style>
    :root{--bleu:#2563eb;--bleu-clair:#eff6ff;--gris:#f1f5f9;--texte:#1e293b;--rouge:#dc2626;--vert:#16a34a}
    *{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', Arial, sans-serif}
    body{background:var(--gris);color:var(--texte)}
    header{background:#fff;padding:15px 20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);position:sticky;top:0;z-index:10}
 .logo{font-size:1.5em;font-weight:800;color:var(--bleu)}.logo span{color:var(--rouge)}
 .btns{display:flex;gap:10px;padding:15px 20px;background:#fff;border-bottom:1px solid #e2e8f0;overflow-x:auto}
 .btn{background:var(--gris);border:none;color:var(--texte);padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
 .btn.active{background:var(--bleu);color:#fff}
 .container{max-width:900px;margin:0 auto;padding:20px}
 .card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
 .score{display:flex;justify-content:space-between;align-items:center;font-size:2.2em;font-weight:800;text-align:center}
 .team{display:flex;flex-direction:column;align-items:center;gap:5px;width:35%}
 .team-logo{width:50px;height:50px;background:var(--bleu-clair);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--bleu)}
 .minute{background:var(--rouge);color:#fff;padding:8px 15px;border-radius:20px;font-size:0.8em;font-weight:700}
 .minute.termine{background:var(--vert)}
 .vs{font-size:0.5em;color:#94a3b8}

    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.9em}
    th{background:var(--bleu-clair);color:var(--bleu);padding:12px;text-align:center;font-weight:700}
    td{padding:12px;text-align:center;border-bottom:1px solid #e2e8f0}
    td:first-child, th:first-child{text-align:left}
    tr:hover{background:#f8fafc}

  /* NOUVEAU: BUTEURS 2 COLONNES */
 .buteurs-wrap{display:flex;gap:20px}
 .buteurs-col{flex:1}
 .buteurs-col h4{margin-bottom:10px;color:var(--bleu)}
 .but{padding:8px 0;border-bottom:1px dashed #e2e8f0;font-size:0.9em}

 .poule-titre{font-size:1.2em;font-weight:800;color:var(--bleu);margin-bottom:10px}
    footer{background:#fff;text-align:center;padding:20px;margin-top:30px;color:#64748b;font-size:0.9em;border-top:1px solid #e2e8f0}
 .loading{text-align:center;padding:40px;color:#94a3b8}
</style>
</head>
<body>

<header><div class="logo">TOURNOI<span>.LIVE</span></div></header>

<nav class="btns">
    <button class="btn active" onclick="showTab('live',this)">🔴 LIVE</button>
    <button class="btn" onclick="showTab('classement',this)">📊 CLASSEMENT</button>
    <button class="btn" onclick="showTab('programme',this)">📅 PROGRAMME</button>
    <button class="btn" onclick="showTab('buteurs',this)">⚽ BUTEURS</button>
</nav>

<div class="container">
    <div id="live" class="tab"></div>
    <div id="classement" class="tab" style="display:none"></div>
    <div id="programme" class="tab" style="display:none"></div>
    <div id="buteurs" class="tab" style="display:none"></div>
</div>

<footer>© 2026 Tournoi.live - Mise à jour auto toutes les 10s</footer>

<script>
const URLS = {
    matchs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=0&single=true&output=csv",
    buteursLive: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=705498821&single=true&output=csv",
    equipes: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=543674070&single=true&output=csv",
    programme: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1749873809&single=true&output=csv",
    resultats: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1338870764&single=true&output=csv",
    buteurs: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRl8wCXh_V2Xkd3cB4eivkqUZb0a3nrw-nlPFByec7ZulCWUFHXc4xo06wLr1OEzYtEsX9SI2HF8auF/pub?gid=1383311710&single=true&output=csv"
}

// PARSER CSV PLUS SOLIDE POUR GOOGLE
function parseCSV(txt){
    return txt.split('\n').map(r => r.replace(/\r/g,'').split(',').map(c => c.trim().replace(/"/g,'')));
}

async function fetchCSV(url){
    const res = await fetch(url + '&t=' + Date.now());
    const txt = await res.text();
    return parseCSV(txt);
}

function calcMinute(heureDebut, statut){
    if(statut.toLowerCase().includes("term")) return "TERMINÉ";
    if(!heureDebut) return "00:00";
    heureDebut = heureDebut.replace('.',':');
    const [h,m] = heureDebut.split(':').map(Number);
    if(isNaN(h)) return "00:00";
    const debut = new Date(); debut.setHours(h,m,0);
    const now = new Date();
    let diff = Math.floor((now - debut)/60000);
    if(diff < 0) return "À venir";
    if(diff > 90) return "90'";
    return diff + "'";
}

function showTab(id,btn){
    document.querySelectorAll('.tab').forEach(t => t.style.display='none');
    document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).style.display='block';
    btn.classList.add('active');
}

// LIVE CORRIGÉ: BUTEURS SEPARES
async function loadLive(){
    const [matchs, buts] = await Promise.all([fetchCSV(URLS.matchs), fetchCSV(URLS.buteursLive)]);
    const match = matchs[1];
    if(!match ||!match[0]) return document.getElementById('live').innerHTML="<div class='loading'>Aucun match</div>";

    const [domi, ext, statut, heure] = match;
    const butsDomi = buts.filter(b => b[1] && b[1].toLowerCase() === domi.toLowerCase());
    const butsExt = buts.filter(b => b[1] && b[1].toLowerCase() === ext.toLowerCase());
    const scoreDomi = butsDomi.length;
    const scoreExt = butsExt.length;
    const minute = calcMinute(heure, statut);
    const isTermine = minute === "TERMINÉ";

    document.getElementById('live').innerHTML = `
    <div class="card">
        <div class="score">
            <div class="team"><div class="team-logo">${domi.substring(0,2)}</div><div>${domi}</div><div>${scoreDomi}</div></div>
            <div><div class="minute ${isTermine?'termine':''}">${minute}</div><div class="vs">VS</div></div>
            <div class="team"><div class="team-logo">${ext.substring(0,2)}</div><div>${ext}</div><div>${scoreExt}</div></div>
        </div>
    </div>
    <div class="card">
        <h3>Buteurs du match</h3>
        <div class="buteurs-wrap">
            <div class="buteurs-col">
