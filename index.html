<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOURNOI - LIVE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Roboto:wght@400;700&display=swap');

  :root{
    --vert: #00FF88;
    --noir: #050505;
    --gris: #121212;
    --blanc: #FFFFFF;
    --jaune: #FFD700;
    --rouge: #FF0033;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background: var(--noir); color: var(--blanc); font-family: 'Roboto', sans-serif; padding-bottom: 90px; }

  /* HEADER STADE */
  header{ background: linear-gradient(180deg, #000 0%, var(--gris) 100%); padding: 15px 10px; border-bottom: 3px solid var(--vert); text-align: center; position: sticky; top:0; z-index:10; }
  header h1{ font-family: 'Anton', sans-serif; color: var(--vert); font-size: 26px; letter-spacing: 2px; text-shadow: 0 0 20px var(--vert); }
  header.live-bar{ color: var(--rouge); font-weight: bold; font-size: 12px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* TABS STYLE TV */
.tabs{ display: flex; gap: 0; margin: 0; background: var(--gris); position: sticky; top: 65px; z-index:9; }
.tab{ background: transparent; color: #AAA; padding: 14px 5px; flex:1; text-align:center; cursor:pointer; font-weight: 700; font-size: 12px; border-bottom: 3px solid transparent; transition: 0.2s; }
.tab.active{ color: var(--vert); border-bottom: 3px solid var(--vert); background: #1A1A1A; }

  /* CARDS STYLE SCOREBOARD */
.card{ background: var(--gris); border-radius: 0; padding: 15px 10px; margin-bottom: 2px; border-left: 5px solid var(--vert); }
.card-live{ border-left: 5px solid var(--rouge); background: #1A0000; }
.score-box{ display:flex; justify-content:space-between; align-items:center; font-family: 'Anton', sans-serif; font-size: 24px; }
.team{ flex:1; }
.vs{ color: var(--vert); padding: 0 10px; }
.goals{ font-size: 12px; color: #CCC; margin-top: 8px; }
.minute{ background: var(--rouge); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

  /* CLASSEMENT TABLEAU PRO */
.poule{ font-family: 'Anton', sans-serif; color: var(--vert); margin: 15px 10px 5px 10px; font-size: 18px; letter-spacing: 1px; }
  table{ width: 100%; background: var(--gris); }
  th{ background: #000; color: var(--vert); padding: 12px 4px; font-size: 12px; text-align: left; }
  td{ padding: 12px 4px; border-bottom: 1px solid #222; }
  td:first-child{ text-align:center; width: 50px; font-weight: bold; }
  tr:hover{ background: #1A1A1A; }

  /* FOOTER PRO */
  footer{ background: #000; border-top: 3px solid var(--vert); padding: 15px 10px; text-align: center; position: fixed; bottom: 0; width: 100%; }
  footer p{ color: #666; font-size: 11px; }
  footer span{ color: var(--vert); }
</style>
</head>
<body>

<header>
  <h1>NOM DU TOURNOI</h1>
  <div class="live-bar">● EN DIRECT</div>
</header>

<div class="tabs">
  <div class="tab active" onclick="show('live', this)">LIVE</div>
  <div class="tab" onclick="show('next', this)">PROGRAMME</div>
  <div class="tab" onclick="show('fini', this)">RÉSULTATS</div>
  <div class="tab" onclick="show('class', this)">CLASSEMENT</div>
  <div class="tab" onclick="show('buteurs', this)">BUTEURS</div>
</div>

<div id="live">Chargement...</div>
<div id="next" style="display:none"></div>
<div id="fini" style="display:none"></div>
<div id="class" style="display:none"></div>
<div id="buteurs" style="display:none"></div>

<footer>
  <p>© 2025 <span>NOM DU TOURNOI</span> | Mise à jour auto toutes les 10 secondes</p>
</footer>

<script>
const SHEET_LIVE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=0&single=true&output=csv";
const SHEET_NEXT = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1457749805&single=true&output=csv";
const SHEET_FINI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1202405658&single=true&output=csv";

let L=[],N=[],F=[];

function show(id, el){
  document.querySelectorAll('#live,#next,#fini,#class,#buteurs').forEach(d=>d.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function csv(csv){ let l=csv.split('\n'), h=l[0].split(',').map(x=>x.trim()); return l.slice(1).map(x=>{let v=x.split(','); let o={}; h.forEach((k,i)=>o[k]=v[i]?v[i].trim():''); return o;}).filter(x=>x['Equipe 1']); }
function buts(t){ let b={}; if(!t) return b; t.split(',').forEach(x=>{let n=x.split(' ')[0]; if(n) b[n]=(b[n]||0)+1}); return b; }

function classement(){
  let t={};
  [...F,...L].forEach(m=>{ if(m['Score 1']==='') return;
    let e1=m['Equipe 1'], e2=m['Equipe 2'], s1=+m['Score 1'], s2=+m['Score 2'], p=m['Poule'];
    if(!t[e1]) t[e1]={e:e1,p:p,pts:0}; if(!t[e2]) t[e2]={e:e2,p:p,pts:0};
    if(s1>s2) t[e1].pts+=3; else if(s2>s1) t[e2].pts+=3; else {t[e1].pts++; t[e2].pts++;}
  });
  return t;
}

function render(){
  let hl=''; L.forEach(m=>{ if(m['Score 1']!=='') hl+=`<div class="card card-live"><div class="minute">● ${m['Minute']}</div><div class="score-box"><div class="team">${m['Equipe 1']}</div><div class="vs">${m['Score 1']} - ${m['Score 2']}</div><div class="team" style="text-align:right">${m['Equipe 2']}</div></div><div class="goals">⚽ ${m['Buteurs']}</div></div>`});
  document.getElementById('live').innerHTML=hl||'<div class="card">Aucun match en cours</div>';

  let hn=''; N.forEach(m=> hn+=`<div class="card"><b>${m['Date']} - ${m['Heure']}</b> | Poule ${m['Poule']}<br>${m['Equipe 1']} <span style="color:var(--vert)">VS</span> ${m['Equipe 2']}</div>`);
  document.getElementById('next').innerHTML=hn;

  let hf=''; F.reverse().forEach(m=> hf+=`<div class="card"><b>${m['Date']} ${m['Heure']}</b> | Poule ${m['Poule']}<div class="score-box"><div class="team">${m['Equipe 1']}</div><div class="vs">${m['Score 1']} - ${m['Score 2']}</div><div class="team" style="text-align:right">${m['Equipe 2']}</div></div><div class="goals">⚽ ${m['Buteurs']}</div></div>`);
  document.getElementById('fini').innerHTML=hf||'<div class="card">Aucun résultat</div>';

  let tc=classement(), poules={};
  Object.values(tc).forEach(x=>{ if(!poules[x.p]) poules[x.p]=[]; poules[x.p].push(x); });
  let hc='';
  for(let p in poules){
    poules[p].sort((a,b)=>b.pts-a.pts);
    hc+=`<div class="poule">GROUPE ${p}</div><table><tr><th>#</th><th>CLUB</th><th style="text-align:center">PTS</th></tr>`;
    poules[p].forEach((x,i)=> hc+=`<tr><td>${i+1}</td><td>${x.e}</td><td style="text-align:center"><b>${x.pts}</b></td></tr>`);
    hc+='</table>';
  }
  document.getElementById('class').innerHTML=hc;

  let tb={}; [...F,...L].forEach(m=>{ let b=buts(m['Buteurs']); for(let n in b) tb[n]=(tb[n]||0)+b[n]; });
  let top=Object.entries(tb).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let hbu='';
  top.forEach((x,i)=> hbu+=`<div class="card"><b>${i+1}. ${x[0]}</b> <span style="float:right; color:var(--jaune); font-weight:bold">${x[1]} BUTS</span></div>`);
  document.getElementById('buteurs').innerHTML=hbu||'<div class="card">Aucun but</div>';
}

Promise.all([fetch(SHEET_LIVE).then(r=>r.text()),fetch(SHEET_NEXT).then(r=>r.text()),fetch(SHEET_FINI).then(r=>r.text())])
.then(([l,n,f])=>{ L=csv(l); N=csv(n); F=csv(f); render(); setInterval(render,10000); });
</script>
</body>
</html>
