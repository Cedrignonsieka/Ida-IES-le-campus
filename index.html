<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOURNOI FOOT 2025 - EN DIRECT</title>
<style>
  :root{
    --vert: #00FF88;
    --vert-dark: #00CC6A;
    --noir: #0A0A0A;
    --noir-light: #1A1A1A;
    --blanc: #FFFFFF;
    --jaune: #FFD700;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background: var(--noir); color: var(--blanc); font-family: 'Segoe UI', Arial; padding-bottom: 80px; }

  /* HEADER PRO */
  header{ background: linear-gradient(90deg, var(--noir) 0%, var(--noir-light) 50%, var(--noir) 100%); padding: 15px 10px; border-bottom: 2px solid var(--vert); text-align: center; }
  header h1{ color: var(--vert); font-size: 22px; text-shadow: 0 0 15px var(--vert); }
  header p{ color: #AAA; font-size: 12px; margin-top: 5px; }

  /* TABS */
.tabs{ display: flex; gap: 8px; margin: 15px 10px; overflow-x: auto; }
.tab{ background: var(--noir-light); color: var(--vert); padding: 12px; border-radius: 8px; flex:1; text-align:center; cursor:pointer; border: 1px solid var(--vert); font-weight: bold; transition: 0.2s; }
.tab.active{ background: var(--vert); color: var(--noir); box-shadow: 0 0 10px var(--vert); }

  /* CARDS */
.card{ background: var(--noir-light); border: 1px solid #333; border-left: 4px solid var(--vert); border-radius: 12px; padding: 15px; margin: 0 10px 12px 10px; }
.score{ font-size: 30px; text-align: center; font-weight: bold; margin: 8px 0; }
.score span{ color: var(--jaune); }
.live{ color: var(--jaune); font-weight: bold; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0.4; } }
.poule{ color: var(--vert); font-weight: bold; margin: 20px 10px 8px 10px; font-size: 18px; border-bottom: 2px solid var(--vert); padding-bottom: 5px; }
  table{ width: 100%; border-collapse: collapse; margin-top: 5px; }
  th{ color: var(--vert); border-bottom: 1px solid var(--vert); padding: 10px 4px; font-size: 13px; }
  td{ padding: 10px 4px; text-align: center; font-size: 14px; }
  tr:nth-child(even){ background: #151515; }

  /* FOOTER PRO */
  footer{ background: var(--noir-light); border-top: 2px solid var(--vert); padding: 20px 10px; text-align: center; position: fixed; bottom: 0; width: 100%; }
  footer p{ color: #888; font-size: 12px; }
  footer a{ color: var(--vert); text-decoration: none; font-weight: bold; }
</style>
</head>
<body>

<header>
  <h1>⚽ NOM DU TOURNOI 2025 ⚽</h1>
  <p>Résultats et Classements en Temps Réel</p>
</header>

<div class="tabs">
  <div class="tab active" onclick="show('live', this)">EN DIRECT</div>
  <div class="tab" onclick="show('next', this)">À VENIR</div>
  <div class="tab" onclick="show('fini', this)">TERMINÉ</div>
  <div class="tab" onclick="show('class', this)">CLASSEMENT</div>
  <div class="tab" onclick="show('buteurs', this)">BUTEURS</div>
</div>

<div id="live">Chargement...</div>
<div id="next" style="display:none"></div>
<div id="fini" style="display:none"></div>
<div id="class" style="display:none"></div>
<div id="buteurs" style="display:none"></div>

<footer>
  <p>© 2025 NOM DU TOURNOI. Tous droits réservés.</p>
  <p>Powered by <a href="#">Toi</a> | Mis à jour toutes les 10s</p>
</footer>

<script>
const SHEET_LIVE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=0&single=true&output=csv";
const SHEET_NEXT = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1457749805&single=true&output=csv";
const SHEET_FINI = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-ANKvWjZDuJ40FPFdxFcV_8xqNmhIcKHIFpGtyE_FrUZ1eQnBYlcOaowymxrYhY34rQofcuQ42IcN/pub?gid=1202405658&single=true&output=csv";

let L=[],N=[],F=[];

function show(id, el){
  document.querySelectorAll('#live,#next,#fini,#class,#buteurs').forEach(d=>d.style.display='none');
  document.getElementById(id).style.display='block';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
}

function csv(csv){
  let l=csv.split('\n'), h=l[0].split(',').map(x=>x.trim());
  return l.slice(1).map(x=>{let v=x.split(','); let o={}; h.forEach((k,i)=>o[k]=v[i]?v[i].trim():''); return o;}).filter(x=>x['Equipe 1']);
}

function buts(t){ let b={}; if(!t) return b; t.split(',').forEach(x=>{let n=x.split(' ')[0]; if(n) b[n]=(b[n]||0)+1}); return b; }

function classement(){
  let t={};
  [...F,...L].forEach(m=>{ if(m['Score 1']==='') return;
    let e1=m['Equipe 1'], e2=m['Equipe 2'], s1=+m['Score 1'], s2=+m['Score 2'], p=m['Poule'];
    if(!t[e1]) t[e1]={e:e1,p:p,pts:0}; if(!t[e2]) t[e2]={e:e2,p:p,pts:0};
    if(s1>s2) t[e1].pts+=3; else if(s2>s1) t[e2].pts+=3; else {t[e1].pts++; t[e2].pts++;}
  });
  return t;
}

function render(){
  let hl=''; L.forEach(m=>{ if(m['Score 1']!=='') hl+=`<div class="card"><div class="live">● EN DIRECT ${m['Minute']}</div><div class="score">${m['Equipe 1']} <span>${m['Score 1']}</span> - <span>${m['Score 2']}</span> ${m['Equipe 2']}</div><div style="color:var(--jaune)">Buts: ${m['Buteurs']}</div></div>`});
  document.getElementById('live').innerHTML=hl||'<div class="card">Aucun match en cours</div>';

  let hn=''; N.forEach(m=> hn+=`<div class="card">${m['Date']} ${m['Heure']} | Poule ${m['Poule']}<br><b>${m['Equipe 1']} vs ${m['Equipe 2']}</b></div>`);
  document.getElementById('next').innerHTML=hn;

  let hf=''; F.reverse().forEach(m=> hf+=`<div class="card">${m['Date']} ${m['Heure']} | Poule ${m['Poule']}<br><div class="score">${m['Equipe 1']} <span>${m['Score 1']}</span> - <span>${m['Score 2']}</span> ${m['Equipe 2']}</div><div style="color:var(--jaune)">Buts: ${m['Buteurs']}</div></div>`);
  document.getElementById('fini').innerHTML=hf||'<div class="card">Aucun match terminé</div>';

  let tc=classement(), poules={};
  Object.values(tc).forEach(x=>{ if(!poules[x.p]) poules[x.p]=[]; poules[x.p].push(x); });
  let hc='';
  for(let p in poules){
    poules[p].sort((a,b)=>b.pts-a.pts);
    hc+=`<div class="poule">POULE ${p}</div><table><tr><th>Rang</th><th>Equipe</th><th>Pts</th></tr>`;
    poules[p].forEach((x,i)=> hc+=`<tr><td>${i+1}</td><td>${x.e}</td><td><b>${x.pts}</b></td></tr>`);
    hc+='</table>';
  }
  document.getElementById('class').innerHTML=hc;

  let tb={}; [...F,...L].forEach(m=>{ let b=buts(m['Buteurs']); for(let n in b) tb[n]=(tb[n]||0)+b[n]; });
  let top=Object.entries(tb).sort((a,b)=>b[1]-a[1]).slice(0,10);
  let hbu='';
  top.forEach((x,i)=> hbu+=`<div class="card">${i+1}. ${x[0]} - <b style="color:var(--jaune)">${x[1]} buts</b></div>`);
  document.getElementById('buteurs').innerHTML=hbu||'<div class="card">Aucun but</div>';
}

Promise.all([fetch(SHEET_LIVE).then(r=>r.text()),fetch(SHEET_NEXT).then(r=>r.text()),fetch(SHEET_FINI).then(r=>r.text())])
.then(([l,n,f])=>{ L=csv(l); N=csv(n); F=csv(f); render(); setInterval(render,10000); });
</script>
</body>
</html>
